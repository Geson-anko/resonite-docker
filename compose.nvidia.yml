# NVIDIA GPU overlay. Layered on base when run.sh detects NVIDIA:
#   docker compose -f compose.yaml -f compose.nvidia.yml up --build
# The driver (libGLX_nvidia / Vulkan ICD) is injected from the host by
# nvidia-container-toolkit, so the image's Mesa is unused.
services:
  app:
    build:
      args:
        GPU: nvidia          # Build a minimal image without Mesa.
    # The toolkit injects the GPU, but /dev/dri is still passed for DRI3 present to X
    # (see compose.yaml for why devices live in the overlays).
    devices:
      - /dev/dri:/dev/dri
    # The toolkit injects the host's matching NVIDIA driver version.
    runtime: nvidia
    environment:
      # Rendering GPU: the monitor side (UUID from .env). `all` if not detected.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_GPU_UUID:-all}
      # Enable all capabilities (default is utility,compute only); we need GL/Vulkan/display.
      NVIDIA_DRIVER_CAPABILITIES: all
