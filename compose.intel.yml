# Intel GPU (iGPU) overlay. Layered on base when run.sh detects Intel:
#   docker compose -f compose.yaml -f compose.intel.yml up --build
# Like AMD, an Intel iGPU needs no special runtime (plain runc). GPU access is covered
# by base's /dev/dri and the render/video groups; the user-space driver (Mesa: GL=iris,
# Vulkan=ANV) ships in the image (GPU=intel build arg).
#
# No Vulkan ICD pinning needed: mesa-vulkan-drivers ships both RADV (AMD) and ANV (Intel)
# ICDs, but on an Intel-only host RADV enumerates no devices and only ANV is visible, so
# the loader picks Intel automatically (no AMD_VULKAN_ICD-style pin required).
#
# Note: an iGPU has limited VRAM/bandwidth, so Resonite runs heavy (launch and minimal
# rendering work).
services:
  app:
    build:
      args:
        GPU: intel           # Build with Mesa (iris/ANV) included.
    # Single iGPU, so pass all of /dev/dri (see compose.yaml for why devices live in
    # the overlays).
    devices:
      - /dev/dri:/dev/dri
