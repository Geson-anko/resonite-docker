# Resonite をコンテナ内で起動し、ホストの X11 デスクトップへ描画する基本構成。
# GPU ベンダー固有の設定は持たない(共通部分のみ)。実際の起動は run.sh が
# GPU を検出して compose.nvidia.yml / compose.amd.yml を重ねて行う:
#   docker compose -f compose.yaml -f compose.nvidia.yml up --build   # NVIDIA
#   docker compose -f compose.yaml -f compose.amd.yml    up --build   # AMD
services:
  app:
    build:
      context: .
      args:
        # 非rootユーザをホストUID/GIDで作る(.env は ./init.sh が生成)。
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1001}
    environment:
      # SSH接続だとホスト側の $DISPLAY は空なので .env の検出値を使う。
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      # 音声: ホストの PulseAudio/PipeWire ソケットへ接続する。Resonite のエンジンは
      # ネイティブ Linux で動き、その音声バックエンドは libpulse 経由でここに繋ぐ。
      # 未設定/未接続だと出力デバイスを開けず初回オンボーディングの Audio ステップで
      # エンジンがハングしてフリーズする(下の volume でソケットを mount している)。
      PULSE_SERVER: unix:/tmp/pulse-native
    # Steam Linux Runtime(pressure-vessel)が user namespace を張るために必要。
    # ホスト側で kernel.apparmor_restrict_unprivileged_userns=0 も必須(./init.sh が確認)。
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    # ホストの X サーバへ描画するため IPC 名前空間をホストと共有する。
    # X の MIT-SHM 拡張は SysV 共有メモリを X クライアント(コンテナ内のエンジン/Wine)と
    # X サーバ(ホスト)で共有するが、Docker 既定は IPC 名前空間を分離するため、コンテナの
    # shm セグメントをホストの X サーバがアタッチできず X_ShmPutImage が BadValue で失敗する。
    # Xlib の既定エラーハンドラは時に exit() を呼ぶので、実行ごとにクラッシュ/ハング/
    # たまに成功とブレる。ipc: host で SysV shm を共有すると解消する。
    # 併せて Resonite のエンジン↔ResoBoot↔Unityレンダラ間 IPC(Cloudtoid.Interprocess,
    # /dev/shm 上の memory-mapped file)も、ホストの広い /dev/shm(31GB)を使えるので
    # Docker 既定の 64MB 不足(Bootstrapper messaging timeout)も同時に回避できる。
    # ※ ipc: host とは shm_size を併用できないため shm_size は指定しない。
    ipc: host
    # GPU(描画)を渡す。NVIDIA のデバイスは toolkit が注入するが、X への
    # DRI3 present 用に /dev/dri も渡す。AMD は Mesa がこの /dev/dri を直接使う。
    devices:
      - /dev/dri:/dev/dri
    # /dev/dri の render/video グループに非rootユーザを参加させる(.env に GID 記録)。
    group_add:
      - "${RENDER_GID:-110}"
      - "${VIDEO_GID:-44}"
    volumes:
      # X11 の Unix ソケット
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # 稼働中の Xorg が実際に使っている認証クッキー(gdm)。
      - /run/user/${HOST_UID:-1000}/gdm/Xauthority:/tmp/.Xauthority:ro
      # ホストの PulseAudio/PipeWire の Unix ソケット(音声出力先)。PipeWire 環境では
      # pipewire-pulse が /run/user/<uid>/pulse/native を提供する。PULSE_SERVER がこれを指す。
      # ソケットへの connect は書き込み権限が要るので :ro は付けない。
      - /run/user/${HOST_UID:-1000}/pulse/native:/tmp/pulse-native
      # Resonite 本体(ホストのSteam版)を read-only でマウント。
      - ${RESONITE_DIR:?run ./init.sh first}:/resonite:ro
      # --- 永続化(HOME 全体ではなく必要なものだけを named volume にする) ---
      # Resonite 本体の書き込み可能コピー。HOME(=volume mount)配下に置くと umu が
      # install の親マウントを gamedrive(S:)にして CWD の現在ドライブが S: になり、
      # 絶対パス(/dev/shm 等)がドライブ相対で誤解決される。HOME 外(/opt)の専用
      # volume に置けば親はマウントで無くなり CWD が Z:(→/)で解決され正常動作する。
      - resonite-app:/opt/resonite
      # umu/Proton/Steam Linux Runtime + Resonite ユーザデータ(login/設定)。
      - resonite-share:/home/resonite/.local/share
      # Resonite アセットキャッシュ + シェーダキャッシュ(再ダウンロード回避)。
      - resonite-cache:/home/resonite/.cache
      # Wine プレフィックス(WINEPREFIX)。
      - resonite-prefix:/home/resonite/prefix

volumes:
  resonite-app:
  resonite-share:
  resonite-cache:
  resonite-prefix:
