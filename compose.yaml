# Base config: run Resonite in a container and render to the host's X11 desktop.
# No GPU-vendor-specific settings here (common parts only). run.sh detects the GPU
# and layers compose.nvidia.yml / compose.amd.yml / compose.intel.yml on top:
#   docker compose -f compose.yaml -f compose.nvidia.yml up --build   # NVIDIA
#   docker compose -f compose.yaml -f compose.amd.yml    up --build   # AMD
services:
  app:
    build:
      context: .
      args:
        # Create the non-root user with the host UID/GID (.env from ./init.sh).
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1001}
    environment:
      # Over SSH the host's $DISPLAY is empty, so use the value detected in .env.
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      # Audio: connect to the host's PulseAudio/PipeWire socket. Resonite's engine
      # runs natively on Linux and its audio backend connects here via libpulse.
      # If unset/unreachable it can't open an output device and freezes at the
      # first-run onboarding "Audio" step (socket mounted in volumes below).
      PULSE_SERVER: unix:/tmp/pulse-native
    # Required for Steam Linux Runtime (pressure-vessel) to set up user namespaces.
    # The host also needs kernel.apparmor_restrict_unprivileged_userns=0 (init.sh checks).
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    # Share the IPC namespace with the host so we can render to the host's X server.
    # The X MIT-SHM extension shares SysV shm between the X client (engine/Wine in the
    # container) and the X server (host); Docker's default isolates the IPC namespace,
    # so the host X server can't attach the container's shm segment and X_ShmPutImage
    # fails with BadValue. Xlib's default error handler sometimes calls exit(), so runs
    # flip between crash/hang/occasional success. ipc: host shares SysV shm and fixes it.
    # It also gives Resonite's engine<->ResoBoot<->Unity-renderer IPC (Cloudtoid.Interprocess,
    # a memory-mapped file in /dev/shm) the host's large /dev/shm, avoiding Docker's
    # default 64 MB shortage (Bootstrapper messaging timeout).
    # Note: shm_size can't be combined with ipc: host, so it isn't set.
    ipc: host
    # How /dev/dri (the GPU) is passed in differs per vendor, so the overlays set it:
    #  - NVIDIA: driver injected by the toolkit; pass all of /dev/dri for DRI3 present.
    #  - Intel:  single iGPU; pass all of /dev/dri, used directly by Mesa (iris/ANV).
    #  - AMD:    on a multi-GPU host (e.g. a server's ASPEED BMC chip + several dGPUs)
    #            passing all of /dev/dri makes the renderer's video-decode init
    #            (GStreamer/Media Foundation) enumerate every DRI node via GBM/EGL and
    #            crash on the non-3D BMC chip (driver (null)). So only the rendering GPU's
    #            render node is passed (init.sh detects it into AMD_RENDER_NODE).
    # Note: devices isn't in base because compose merges lists by append — base entries
    #       can't be removed, so the AMD overlay couldn't exclude all of /dev/dri.
    # Add the non-root user to /dev/dri's render/video groups (GIDs recorded in .env).
    group_add:
      - "${RENDER_GID:-110}"
      - "${VIDEO_GID:-44}"
    volumes:
      # X11 Unix socket. On a Wayland session Xwayland exposes its socket here, so
      # Resonite's Wine renderer can draw through Xwayland.
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # X auth cookie. init.sh takes the current DISPLAY's cookie, rewrites it to
      # FamilyWild into .xauth, and writes that path to XAUTHORITY_HOST in .env. Being
      # host-independent, it authenticates from the container (random hostname) too.
      # init.sh absorbs the per-desktop cookie path differences (gdm/KDE/Wayland).
      # The /dev/null default keeps Docker from creating a phantom dir if init.sh
      # wasn't run.
      - ${XAUTHORITY_HOST:-/dev/null}:/tmp/.Xauthority:ro
      # The host's PulseAudio/PipeWire Unix socket (audio output). On PipeWire,
      # pipewire-pulse provides /run/user/<uid>/pulse/native; PULSE_SERVER points at it.
      # connect() to the socket needs write access, so no :ro.
      - /run/user/${HOST_UID:-1000}/pulse/native:/tmp/pulse-native
      # Resonite itself (the host's Steam install), mounted read-only.
      - ${RESONITE_DIR:?run ./init.sh first}:/resonite:ro
      # --- Persistence (only the necessary paths as named volumes, not all of HOME) ---
      # Writable copy of Resonite. Placed under HOME (a volume mount) it would make umu
      # treat the install's parent mount as the S: gamedrive, the CWD's current drive
      # becomes S:, and absolute paths (/dev/shm, ...) misresolve. In a dedicated volume
      # outside HOME (/opt) the parent isn't a mount, so CWD is Z: (-> /) and works.
      - resonite-app:/opt/resonite
      # umu/Proton/Steam Linux Runtime + Resonite user data (login/settings).
      - resonite-share:/home/resonite/.local/share
      # Resonite asset cache + shader cache (avoids re-downloading).
      - resonite-cache:/home/resonite/.cache
      # Wine prefix (WINEPREFIX).
      - resonite-prefix:/home/resonite/prefix

volumes:
  resonite-app:
  resonite-share:
  resonite-cache:
  resonite-prefix:
