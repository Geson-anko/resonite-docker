services:
  app:
    build: .
    environment:
      # SSH接続だとホスト側の $DISPLAY は空なので、デスクトップの :0 にフォールバック。
      # ローカルで動かす場合は既存の $DISPLAY がそのまま使われる。
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      # X11 の Unix ソケット
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # 稼働中の Xorg が実際に使っている認証クッキー(gdm)。
      # ~/.Xauthority ではなくこちらが本物。HOST_UID は `id -u` の値(.env参照)。
      - /run/user/${HOST_UID:-1000}/gdm/Xauthority:/tmp/.Xauthority:ro
      # Resonite 本体(ホストのSteam版)を read-only でマウント。
      # RESONITE_DIR は ./init.sh が .env に書き出す。
      - ${RESONITE_DIR:?run ./init.sh first}:/resonite:ro
