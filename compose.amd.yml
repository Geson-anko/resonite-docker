# AMD GPU overlay. Layered on base when run.sh detects AMD:
#   docker compose -f compose.yaml -f compose.amd.yml up --build
# AMD needs no special runtime (plain runc). GPU access is covered by base's /dev/dri
# and the render/video groups; the user-space driver (Mesa RADV) ships in the image.
services:
  app:
    build:
      args:
        GPU: amd             # Build with Mesa (RADV) included.
    # Pass only the rendering GPU's render node (the monitor side; value detected into
    # .env by init.sh). On a multi-GPU host (e.g. a server's ASPEED BMC chip + several
    # dGPUs), passing all of /dev/dri makes the renderer's (Renderite=Unity) video-decode
    # init (GStreamer/Media Foundation) enumerate every DRI node via GBM/EGL and crash on
    # the non-3D BMC chip (driver (null)/kmsro missing) -> UnityCrashHandler -> Killed.
    # Limiting to one render node hides every other GPU from the container, so neither
    # Vulkan nor GBM/EGL enumeration trips (same idea as pinning NVIDIA to one GPU).
    # On a single-GPU host where nothing is detected, fall back to all of /dev/dri.
    devices:
      - ${AMD_RENDER_NODE:-/dev/dri}:${AMD_RENDER_NODE:-/dev/dri}
    environment:
      # Pin the Vulkan ICD to Mesa RADV (stable even if AMDVLK is also present).
      AMD_VULKAN_ICD: RADV
      # Also pin the rendering GPU via Mesa device selection (devices already limits to
      # one render node, but this hides llvmpipe too and forces the display GPU):
      #  - MESA_VK_DEVICE_SELECT=<vendor:device>!  : pin Vulkan (Renderite) to one GPU
      #  - DRI_PRIME=pci-....                      : point the GL/EGL path at the same GPU
      # Empty (single-GPU host, nothing detected) -> Mesa's default enumeration.
      MESA_VK_DEVICE_SELECT: ${AMD_VK_DEVICE_SELECT:-}
      DRI_PRIME: ${AMD_DRI_PRIME:-}
